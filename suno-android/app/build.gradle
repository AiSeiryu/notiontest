plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seiryu.sunoexport'
    compileSdk 35

    defaultConfig {
        applicationId 'com.seiryu.sunoexport'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
