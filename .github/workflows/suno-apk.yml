name: Build Suno Android URL APK

on:
  push:
    branches:
      - suno-apk-url-ui-20260926
    paths:
      - 'suno-android/**'
      - '.github/workflows/suno-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle -p suno-android --no-daemon clean assembleDebug

      - name: Copy APK
        run: cp suno-android/app/build/outputs/apk/debug/app-debug.apk SunoExportToolkit-S10e-URL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunoExportToolkit-S10e-URL
          path: SunoExportToolkit-S10e-URL.apk
          if-no-files-found: error
